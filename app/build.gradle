plugins { id 'com.android.application' }
android {
    namespace 'us.mrhaydenn.antispoileresports.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'us.mrhaydenn.antispoileresports.tv'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('ciVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('ciVersionName').getOrElse('0.1.0-dev')
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://antispoileresports.mrhaydenn.us"'
        manifestPlaceholders = [allowCleartext: 'false']
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        github {
            if (System.getenv('TV_KEYSTORE_PATH')) {
                storeFile file(System.getenv('TV_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TV_KEY_ALIAS')
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { manifestPlaceholders = [allowCleartext: 'true'] }
        release { minifyEnabled false; signingConfig signingConfigs.github }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
